<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>aur-curator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:        #0e1210;
  --panel:     #141a17;
  --panel-2:   #101513;
  --line:      #2b3630;
  --line-dim:  #1e2723;
  --text:      #cfe0d4;
  --text-dim:  #6f8177;
  --text-mute: #47564d;
  --amber:     #e8b168;
  --amber-dim: #8a683c;
  --green:     #7fd99a;
  --green-dim: #48624f;
  --red:       #e0715f;
  --red-dim:   #7a4238;
  --blue:      #7fb8d9;
  --cursor:    #1c2b22;
  --font: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  font-family:var(--font);
  color:var(--text);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{
  max-width:1180px;
  margin:24px auto;
  border:1px solid var(--line);
  background:var(--panel);
  box-shadow:0 0 0 1px #000, 0 20px 60px rgba(0,0,0,0.45);
}

/* ---------- shared bits ---------- */
.hdr-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:var(--panel-2);
}
.brand{color:var(--amber);font-weight:700;letter-spacing:0.5px;}
.brand .caret{color:var(--green);animation:blink 1.1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.dim{color:var(--text-dim);}
.mute{color:var(--text-mute);}
.pill{
  border:1px solid var(--line);
  padding:1px 8px;
  border-radius:2px;
  color:var(--text-dim);
  font-size:11px;
}
.pill b{color:var(--text);font-weight:600;}
.pill.active{color:var(--amber);border-color:var(--amber-dim);}

.subbar{
  display:flex;gap:18px;align-items:center;
  padding:8px 16px;
  border-bottom:1px solid var(--line-dim);
  font-size:12px;
}
.subbar input[type=text]{
  background:var(--cursor);
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--font);
  font-size:12px;
  padding:4px 8px;
  width:220px;
  outline:none;
}
.subbar input[type=text]:focus{border-color:var(--amber-dim);}
.subbar label{color:var(--text-dim);}
select{
  background:var(--cursor);
  border:1px solid var(--line);
  color:var(--text);
  font-family:var(--font);
  font-size:12px;
  padding:3px 6px;
}

.statbar{
  display:flex;gap:0;
  padding:0 16px;
  border-bottom:1px solid var(--line-dim);
  font-size:12px;
  flex-wrap:wrap;
}
.stat{
  padding:8px 16px 8px 0;
  margin-right:16px;
  border-right:1px solid var(--line-dim);
  cursor:pointer;
  color:var(--text-dim);
  user-select:none;
}
.stat:last-child{border-right:none;}
.stat b{color:var(--text);font-weight:600;}
.stat:hover{color:var(--amber);}
.stat.on{color:var(--amber);}
.stat.on b{color:var(--amber);}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;
  font-weight:600;
  color:var(--text-mute);
  text-transform:uppercase;
  font-size:10.5px;
  letter-spacing:0.6px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  white-space:nowrap;
}
thead th:hover{color:var(--text-dim);}
thead th.sorted{color:var(--amber);}
tbody td{
  padding:7px 10px;
  border-bottom:1px solid var(--line-dim);
  white-space:nowrap;
}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--cursor);}
tbody tr.sel td{background:#1a2820;}
.pkgname{color:var(--text);font-weight:600;}
.state-tag{
  display:inline-block;
  padding:1px 7px;
  border:1px solid;
  border-radius:2px;
  font-size:11px;
}
.state-review{color:var(--amber);border-color:var(--amber-dim);}
.state-approved{color:var(--blue);border-color:#3d5b6b;}
.state-buildpending{color:var(--blue);border-color:#3d5b6b;}
.state-built{color:var(--green);border-color:var(--green-dim);}
.state-installed{color:var(--text-dim);border-color:var(--line);}
.state-failed{color:var(--red);border-color:var(--red-dim);}
.state-fetched{color:var(--text-dim);border-color:var(--line);}
.state-merged{color:var(--blue);border-color:#3d5b6b;}
.state-published{color:var(--green);border-color:var(--green-dim);}

.risk{font-weight:700;font-size:11px;letter-spacing:0.5px;}
.risk-high{color:var(--red);}
.risk-medium{color:var(--amber);}
.risk-low{color:var(--text-dim);}
.delta-pos{color:var(--amber);}
.delta-zero{color:var(--text-mute);}
.yes{color:var(--green-dim);}
.no{color:var(--text-mute);}
.build-pass{color:var(--green);}
.build-fail{color:var(--red);}
.build-queue{color:var(--blue);}
.build-none{color:var(--text-mute);}

/* ---------- footer ---------- */
.keybar{
  display:flex;flex-wrap:wrap;gap:14px;
  padding:8px 16px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line-dim);
  font-size:11.5px;
  background:var(--panel-2);
}
.keybar .k{
  cursor:pointer;color:var(--text-dim);
}
.keybar .k kbd{
  color:var(--bg);
  background:var(--amber);
  border-radius:2px;
  padding:0px 5px;
  font-weight:700;
  margin-right:5px;
  font-size:11px;
}
.keybar .k:hover{color:var(--text);}
.keybar .k.disabled{opacity:0.35;cursor:not-allowed;}
.keybar .k.disabled kbd{background:var(--text-mute);}

.ops{padding:10px 16px 14px;}
.ops-title{color:var(--text-mute);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;}
.op-line{display:flex;gap:10px;align-items:center;color:var(--text-dim);padding:2px 0;font-size:12px;}
.op-line .bullet{color:var(--amber);}
.op-bar{flex:1;max-width:160px;height:5px;background:var(--line-dim);position:relative;overflow:hidden;}
.op-bar > span{position:absolute;left:0;top:0;bottom:0;background:var(--amber-dim);}
.op-empty{color:var(--text-mute);font-style:normal;font-size:12px;}

/* ---------- detail view ---------- */
.crumbs{padding:10px 16px;border-bottom:1px solid var(--line-dim);font-size:12px;color:var(--text-dim);}
.crumbs .back{color:var(--amber);cursor:pointer;}
.crumbs .back:hover{text-decoration:underline;}
.detail-head{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline;}
.detail-head h1{font-size:16px;margin:0;color:var(--text);font-weight:700;}
.detail-head .sub{color:var(--text-dim);font-size:12px;}

.tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{
  padding:6px 12px;font-size:12px;color:var(--text-dim);
  border:1px solid transparent;border-bottom:none;cursor:pointer;
}
.tab.on{color:var(--amber);background:var(--cursor);border-color:var(--line);border-bottom:1px solid var(--panel);position:relative;top:1px;}
.tab:hover:not(.on){color:var(--text);}

.tabpanel{padding:16px;min-height:260px;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:12.5px;}
.kv .k{color:var(--text-mute);}
.kv .v{color:var(--text);}
.box-title{color:var(--text-mute);font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;margin:0 0 8px;}
.side-box{border:1px solid var(--line-dim);padding:10px 12px;margin-bottom:14px;}

.difflines{font-size:12px;background:var(--panel-2);border:1px solid var(--line-dim);}
.difflines .l{padding:2px 10px;white-space:pre;}
.difflines .add{color:var(--green);background:#132018;}
.difflines .rem{color:var(--red);background:#241412;}
.difflines .ctx{color:var(--text-dim);}
.difflines .hunk{color:var(--blue);background:#0f1a20;}

.commit-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-dim);font-size:12.5px;}
.commit-row .hash{color:var(--amber);}
.commit-row .msg{color:var(--text);flex:1;}
.commit-row .meta{color:var(--text-mute);}

.finding{border:1px solid var(--line-dim);padding:10px 12px;margin-bottom:8px;}
.finding .fh{display:flex;gap:10px;align-items:center;margin-bottom:4px;}
.finding .fsev{font-weight:700;font-size:10.5px;letter-spacing:0.5px;padding:1px 6px;border:1px solid;}
.finding .fcat{color:var(--text-dim);font-size:11px;}
.finding .fsum{color:var(--text);font-size:12.5px;}
.finding .fdetail{color:var(--text-dim);font-size:11.5px;margin-top:4px;}

.btnrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
button.act{
  font-family:var(--font);
  background:transparent;
  border:1px solid var(--line);
  color:var(--text-dim);
  padding:6px 14px;
  font-size:12px;
  cursor:pointer;
}
button.act:hover{border-color:var(--amber-dim);color:var(--amber);}
button.act.primary{border-color:var(--green-dim);color:var(--green);}
button.act.primary:hover{background:#12241a;}
button.act.danger{border-color:var(--red-dim);color:var(--red);}
button.act.danger:hover{background:#221513;}
button.act:disabled{opacity:0.3;cursor:not-allowed;}

.buildlog{
  background:#0a0d0b;border:1px solid var(--line-dim);
  padding:12px;font-size:12px;color:var(--text-dim);
  max-height:320px;overflow:auto;white-space:pre-wrap;
}
.buildlog .ok{color:var(--green);}
.buildlog .warn{color:var(--amber);}
.buildlog .err{color:var(--red);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#152018;border:1px solid var(--green-dim);color:var(--green);
  padding:8px 16px;font-size:12px;font-family:var(--font);
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.empty{color:var(--text-mute);font-size:12px;padding:30px 0;text-align:center;}
::selection{background:#2c4033;color:#fff;}
</style>
</head>

/* ---------------------------------------------------------------
   STATE
---------------------------------------------------------------- */
let state = {
  view: "dashboard",          // dashboard | detail
  selected: null,             // package name
  tab: "summary",             // summary | commits | pkgbuild | srcinfo | install | patch | findings | buildlog
  search: "",
  filter: "All",
  sort: "Lifecycle",
  selRow: null,                // keyboard/click row highlight on dashboard
};

const el = document.getElementById("app");
const toastEl = document.getElementById("toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove("show"), 1800);
}

function pkgByName(n){ return packages.find(p=>p.name===n); }

function stateClass(s){
  return "state-" + s.toLowerCase().replace(/\s+/g,"");
}
function riskClass(r){
  return "risk-" + r.toLowerCase();
}
function buildClass(b){
  if(b==="PASS") return "build-pass";
  if(b==="Failed") return "build-fail";
  if(b==="Queue") return "build-queue";
  return "build-none";
}

/* ---------------------------------------------------------------
   RENDER: ROOT
---------------------------------------------------------------- */
function render(){
  if(state.view==="dashboard"){
    el.innerHTML = renderDashboard();
    bindDashboard();
  } else {
    el.innerHTML = renderDetail();
    bindDetail();
  }
}

/* ---------------------------------------------------------------
   DASHBOARD
---------------------------------------------------------------- */
function computeCounts(){
  const c = {review:0, approved:0, build:0, failed:0, unpublished:0, updates:0};
  packages.forEach(p=>{
    if(p.state==="Review Pending") c.review++;
    if(p.state==="Approved") c.approved++;
    if(p.state==="Build Pending") c.build++;
    if(p.build==="Failed") c.failed++;
    if(!p.published) c.unpublished++;
    if(p.delta>0) c.updates++;
  });
  return c;
}

function filteredPackages(){
  let list = packages.slice();
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q));
  }
  if(state.filter!=="All"){
    const map = {
      "Review Pending":"Review Pending","Approved":"Approved","Build Pending":"Build Pending",
      "Failed Builds":"__failed__","Unpublished":"__unpub__","Has Updates":"__updates__"
    };
    const f = map[state.filter];
    if(f==="__failed__") list = list.filter(p=>p.build==="Failed");
    else if(f==="__unpub__") list = list.filter(p=>!p.published);
    else if(f==="__updates__") list = list.filter(p=>p.delta>0);
    else if(f) list = list.filter(p=>p.state===f);
  }
  if(state.sort==="Lifecycle"){
    list.sort((a,b)=>LIFECYCLE.indexOf(a.state)-LIFECYCLE.indexOf(b.state));
  } else if(state.sort==="Name"){
    list.sort((a,b)=>a.name.localeCompare(b.name));
  } else if(state.sort==="Risk"){
    const order = {High:0,Medium:1,Low:2};
    list.sort((a,b)=>order[a.risk]-order[b.risk]);
  } else if(state.sort==="Commits Behind"){
    list.sort((a,b)=>b.delta-a.delta);
  }
  return list;
}

function renderDashboard(){
  const counts = computeCounts();
  const list = filteredPackages();
  const buildingCount = packages.filter(p=>p.build==="Queue"||p._building).length;
  const analyzingCount = packages.filter(p=>p._analyzing).length;

  return `
    <div class="hdr-row">
      <div class="brand">aur-curator<span class="caret">_</span></div>
      <div style="display:flex;gap:16px;align-items:center;">
        <span class="dim">Workspace:</span> <span>~/repos/aur</span>
      </div>
    </div>
    <div class="hdr-row" style="padding-top:6px;padding-bottom:6px;">
      <div class="dim">Last Refresh: <span style="color:var(--text)">${lastRefresh()}</span></div>
      <div style="display:flex;gap:8px;">
        <span class="pill ${buildingCount?'active':''}">Build(<b>${buildingCount}</b>)</span>
        <span class="pill">Fetch(<b>0</b>)</span>
        <span class="pill ${analyzingCount?'active':''}">Analyze(<b>${analyzingCount}</b>)</span>
      </div>
    </div>

    <div class="subbar">
      <input id="search" type="text" placeholder="package name..." value="${escapeHtml(state.search)}"/>
      <label>Filter:
        <select id="filter">
          ${["All","Review Pending","Approved","Build Pending","Failed Builds","Unpublished","Has Updates"]
            .map(f=>`<option ${f===state.filter?'selected':''}>${f}</option>`).join("")}
        </select>
      </label>
      <label>Sort:
        <select id="sort">
          ${["Lifecycle","Name","Risk","Commits Behind"]
            .map(f=>`<option ${f===state.sort?'selected':''}>${f}</option>`).join("")}
        </select>
      </label>
      <span class="dim" style="margin-left:auto;">${list.length} shown</span>
    </div>

    <div class="statbar">
      <div class="stat ${state.filter==='All'?'on':''}" data-f="All">Packages <b>${packages.length}</b></div>
      <div class="stat ${state.filter==='Review Pending'?'on':''}" data-f="Review Pending">Review <b>${counts.review}</b></div>
      <div class="stat ${state.filter==='Approved'?'on':''}" data-f="Approved">Approved <b>${counts.approved}</b></div>
      <div class="stat ${state.filter==='Build Pending'?'on':''}" data-f="Build Pending">Build <b>${counts.build}</b></div>
      <div class="stat ${state.filter==='Failed Builds'?'on':''}" data-f="Failed Builds">Failed <b>${counts.failed}</b></div>
      <div class="stat ${state.filter==='Unpublished'?'on':''}" data-f="Unpublished">Unpublished <b>${counts.unpublished}</b></div>
      <div class="stat ${state.filter==='Has Updates'?'on':''}" data-f="Has Updates">Updates <b>${counts.updates}</b></div>
    </div>

    <table>
      <thead>
        <tr>
          <th data-s="Name">Pkg</th>
          <th data-s="Lifecycle">State</th>
          <th>Inst</th>
          <th>Upstream</th>
          <th data-s="Commits Behind">&Delta;</th>
          <th>Merge</th>
          <th>Repo</th>
          <th data-s="Risk">Risk</th>
          <th>Build</th>
          <th>Published</th>
        </tr>
      </thead>
      <tbody>
        ${list.length ? list.map(rowHtml).join("") : ''}
      </tbody>
    </table>
    ${list.length===0 ? `<div class="empty">No packages match this filter. Press <b style="color:var(--amber)">Esc</b> or clear search.</div>` : ""}

    <div class="keybar">
      <span class="k" data-act="open"><kbd>ENTER</kbd>Open</span>
      <span class="k" data-act="fetch"><kbd>F</kbd>Fetch</span>
      <span class="k" data-act="refresh"><kbd>R</kbd>Refresh</span>
      <span class="k" data-act="analyze"><kbd>A</kbd>Analyze</span>
      <span class="k" data-act="build"><kbd>B</kbd>Build</span>
      <span class="k" data-act="publish"><kbd>P</kbd>Publish</span>
      <span class="k" data-act="install"><kbd>I</kbd>Install</span>
      <span class="k" data-act="focus-search"><kbd>/</kbd>Search</span>
    </div>

    <div class="ops">
      <div class="ops-title">Operations</div>
      ${opsFeed.length ? opsFeed.map(o=>`
        <div class="op-line">
          <span class="bullet">&bull;</span>
          <span>${escapeHtml(o.label)}</span>
          ${o.pct!==null ? `<div class="op-bar"><span style="width:${o.pct}%"></span></div><span class="mute">${o.pct}%</span>` : ""}
        </div>
      `).join("") : `<div class="op-empty">Idle &mdash; nothing running.</div>`}
    </div>
  `;
}

function rowHtml(p){
  const rowSel = state.selRow===p.name ? "sel" : "";
  return `
    <tr class="${rowSel}" data-name="${p.name}">
      <td class="pkgname">${p.name}</td>
      <td><span class="state-tag ${stateClass(p.state)}">${p.state}</span></td>
      <td class="dim">${p.installed}</td>
      <td>${p.upstream}</td>
      <td class="${p.delta>0?'delta-pos':'delta-zero'}">${p.delta}</td>
      <td class="dim">${p.merge}</td>
      <td class="${p.clean?'dim':'risk-medium'}">${p.clean?'Clean':'Dirty'}</td>
      <td class="risk ${riskClass(p.risk)}">${p.risk.toUpperCase()}</td>
      <td class="${buildClass(p.build)}">${p.build}</td>
      <td class="${p.published?'yes':'no'}">${p.published?'Yes':'No'}</td>
    </tr>
  `;
}

function lastRefresh(){
  const d = new Date();
  return d.toTimeString().slice(0,5);
}

function bindDashboard(){
  const search = document.getElementById("search");
  search.addEventListener("input", e=>{ state.search = e.target.value; render(); preserveFocus("search"); });
  document.getElementById("filter").addEventListener("change", e=>{ state.filter = e.target.value; render(); });
  document.getElementById("sort").addEventListener("change", e=>{ state.sort = e.target.value; render(); });

  el.querySelectorAll(".stat").forEach(s=>{
    s.addEventListener("click", ()=>{ state.filter = s.dataset.f; render(); });
  });

  el.querySelectorAll("tbody tr").forEach(tr=>{
    tr.addEventListener("click", ()=>{
      state.selRow = tr.dataset.name;
      openDetail(tr.dataset.name);
    });
  });

  el.querySelectorAll(".keybar .k").forEach(k=>{
    k.addEventListener("click", ()=>{
      const act = k.dataset.act;
      if(act==="focus-search"){ document.getElementById("search").focus(); return; }
      if(act==="open"){
        const target = state.selRow || (filteredPackages()[0] && filteredPackages()[0].name);
        if(target) openDetail(target);
        return;
      }
      const target = state.selRow;
      if(!target){ toast("Select a package first"); return; }
      runAction(act, target);
    });
  });
}

function preserveFocus(id){
  const node = document.getElementById(id);
  if(node){ node.focus(); node.selectionStart = node.selectionEnd = node.value.length; }
}

/* ---------------------------------------------------------------
   ACTIONS (mechanical only — mirrors "Automate mechanics, never trust")
---------------------------------------------------------------- */
function runAction(act, name){
  const p = pkgByName(name);
  if(!p) return;
  switch(act){
    case "fetch":
      toast(`Fetching ${name} from upstream...`);
      setTimeout(()=>toast(`${name}: fetch complete, ${p.delta} commit(s) behind`), 700);
      break;
    case "refresh":
      toast("Refreshing repository state from Git...");
      break;
    case "analyze":
      if(p.state!=="Review Pending" && p.state!=="Fetched"){ toast(`${name} has nothing pending review`); return; }
      toast(`Running analyzers on ${name}...`);
      break;
    case "build":
      if(p.state!=="Build Pending" && p.state!=="Merged"){ toast(`${name} is not ready to build (requires Merged)`); return; }
      p.build = "Queue";
      p.state = "Build Pending";
      opsFeed = opsFeed.filter(o=>!o.label.includes(name));
      opsFeed.push({label:`Building ${name}`, pct: 5});
      toast(`Build queued for ${name}`);
      render();
      break;
    case "publish":
      if(p.build!=="PASS"){ toast(`${name} has no successful build to publish`); return; }
      p.published = true;
      p.state = "Published";
      toast(`Published ${name} to local pacman repository`);
      render();
      break;
    case "install":
      if(!p.published){ toast(`${name} must be published before install`); return; }
      p.state = "Installed";
      toast(`Installed ${name} via pacman`);
      render();
      break;
  }
}

/* ---------------------------------------------------------------
   DETAIL VIEW  (Package Details -> Review / Build Log, per ui-overview.md)
---------------------------------------------------------------- */
function openDetail(name){
  state.view = "detail";
  state.selected = name;
  state.tab = "summary";
  render();
}

function backToDashboard(){
  state.view = "dashboard";
  render();
}

const REVIEW_TABS = [
  {id:"summary", label:"Summary"},
  {id:"commits", label:"Commit History"},
  {id:"pkgbuild", label:"PKGBUILD Diff"},
  {id:"srcinfo", label:".SRCINFO Diff"},
  {id:"install", label:".install Diff"},
  {id:"patch", label:"Patch Diff"},
  {id:"findings", label:"Findings"},
  {id:"decision", label:"Decision"},
  {id:"buildlog", label:"Build Log"},
];

function renderDetail(){
  const p = pkgByName(state.selected);
  if(!p){ backToDashboard(); return ""; }

  return `
    <div class="hdr-row">
      <div class="brand">aur-curator<span class="caret">_</span></div>
      <div class="dim">Workspace: ~/repos/aur</div>
    </div>
    <div class="crumbs">
      <span class="back" data-back="1">&larr; Dashboard</span>
      <span class="mute"> / </span> Package Details <span class="mute"> / </span> ${p.name}
    </div>
    <div class="detail-head">
      <div>
        <h1>${p.name}</h1>
        <div class="sub">installed ${p.installed} &nbsp;&rarr;&nbsp; upstream ${p.upstream}
          &nbsp;&middot;&nbsp; <span class="state-tag ${stateClass(p.state)}">${p.state}</span></div>
      </div>
      <div class="risk ${riskClass(p.risk)}">${p.risk.toUpperCase()} RISK</div>
    </div>

    <div class="tabs">
      ${REVIEW_TABS.map(t=>`<div class="tab ${state.tab===t.id?'on':''}" data-tab="${t.id}">${t.label}</div>`).join("")}
    </div>

    <div class="tabpanel">
      ${renderTab(p)}
    </div>
  `;
}

function renderTab(p){
  switch(state.tab){
    case "summary": return tabSummary(p);
    case "commits": return tabCommits(p);
    case "pkgbuild": return tabDiff(p, "PKGBUILD");
    case "srcinfo": return tabDiff(p, ".SRCINFO");
    case "install": return tabDiff(p, ".install");
    case "patch": return tabDiff(p, "patch");
    case "findings": return tabFindings(p);
    case "decision": return tabDecision(p);
    case "buildlog": return tabBuildLog(p);
    default: return "";
  }
}

function tabSummary(p){
  const highest = p.findings.reduce((acc,f)=>{
    const order={High:3,Medium:2,Low:1};
    return order[f.sev]>order[acc] ? f.sev : acc;
  }, "Low");
  return `
    <div class="grid2">
      <div>
        <p class="box-title">Package</p>
        <div class="kv">
          <div class="k">Lifecycle</div><div class="v">${p.state}</div>
          <div class="k">Installed</div><div class="v">${p.installed}</div>
          <div class="k">Upstream</div><div class="v">${p.upstream}</div>
          <div class="k">Commits behind</div><div class="v">${p.delta}</div>
          <div class="k">Merge status</div><div class="v">${p.merge}</div>
          <div class="k">Repo cleanliness</div><div class="v">${p.clean?'Clean':'Dirty (uncommitted changes)'}</div>
          <div class="k">Published</div><div class="v">${p.published?'Yes':'No'}</div>
        </div>
        <div class="btnrow">
          <button class="act" data-a="fetch">Fetch</button>
          <button class="act" data-a="analyze">Run analyzers</button>
          <button class="act primary" data-a="build" ${p.state!=="Build Pending"&&p.state!=="Merged"?"disabled":""}>Build</button>
          <button class="act primary" data-a="publish" ${p.build!=="PASS"?"disabled":""}>Publish</button>
          <button class="act" data-a="install" ${!p.published?"disabled":""}>Install</button>
        </div>
      </div>
      <div>
        <div class="side-box">
          <p class="box-title">Review</p>
          <div class="kv">
            <div class="k">Status</div><div class="v">${p.findings.length? "Pending" : "No findings"}</div>
            <div class="k">Highest severity</div><div class="v risk-${highest.toLowerCase()}" style="display:inline">${highest.toUpperCase()}</div>
            <div class="k">Findings</div><div class="v">${p.findings.length}</div>
          </div>
        </div>
        <div class="side-box">
          <p class="box-title">Latest build</p>
          <div class="kv">
            <div class="k">Result</div><div class="v">${p.build==="--"?"No build yet":p.build}</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function tabCommits(p){
  if(!p.commits.length) return `<div class="empty">No commit history recorded for this review.</div>`;
  return `
    <p class="box-title">Upstream commits under review</p>
    ${p.commits.map(c=>`
      <div class="commit-row">
        <span class="hash">${c.hash}</span>
        <span class="msg">${escapeHtml(c.msg)}</span>
        <span class="meta">${c.meta}</span>
      </div>
    `).join("")}
  `;
}

function tabDiff(p, kind){
  const applicable = kind==="PKGBUILD" ? p.diff : [];
  if(!applicable.length){
    return `<div class="empty">No ${kind} changes in this review.</div>`;
  }
  return `
    <p class="box-title">${kind} diff</p>
    <div class="difflines">
      ${applicable.map(d=>`<div class="l ${d.t}">${escapeHtml(d.l)}</div>`).join("")}
    </div>
  `;
}

function tabFindings(p){
  if(!p.findings.length) return `<div class="empty">No findings produced by analyzers.</div>`;
  return `
    <p class="box-title">Analyzer findings</p>
    ${p.findings.map(f=>`
      <div class="finding">
        <div class="fh">
          <span class="fsev ${riskClass(f.sev)}" style="border-color:currentColor;">${f.sev.toUpperCase()}</span>
          <span class="fcat">${f.cat}</span>
        </div>
        <div class="fsum">${escapeHtml(f.summary)}</div>
        <div class="fdetail">${escapeHtml(f.detail)}</div>
      </div>
    `).join("")}
  `;
}

function tabDecision(p){
  const canDecide = p.state==="Review Pending";
  return `
    <p class="box-title">Trust decision</p>
    <p class="dim" style="max-width:520px;">This decision is recorded permanently and cannot be reversed once made &mdash;
    approving merges the reviewed commit into the personal repository; nothing is auto-built or auto-installed.</p>
    <div class="btnrow">
      <button class="act primary" data-a="approve" ${!canDecide?"disabled":""}>Approve &amp; Merge</button>
      <button class="act danger" data-a="reject" ${!canDecide?"disabled":""}>Reject</button>
    </div>
    ${!canDecide ? `<p class="mute" style="margin-top:10px;">No decision pending &mdash; current state is "${p.state}".</p>` : ""}
  `;
}

function tabBuildLog(p){
  if(!p.buildlog) return `<div class="empty">No build has been run yet.</div>`;
  const colored = p.buildlog
    .replace(/BUILD OK.*/,'<span class="ok">$&</span>')
    .replace(/BUILD FAILED.*/,'<span class="err">$&</span>')
    .replace(/FAILED/g,'<span class="err">FAILED</span>')
    .replace(/ERROR:.*/g,'<span class="err">$&</span>');
  return `
    <p class="box-title">Build log</p>
    <div class="buildlog">${colored}</div>
  `;
}

function bindDetail(){
  el.querySelector("[data-back]").addEventListener("click", backToDashboard);
  el.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{ state.tab = t.dataset.tab; render(); });
  });
  el.querySelectorAll("[data-a]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const a = b.dataset.a;
      const p = pkgByName(state.selected);
      if(a==="approve"){
        p.state = "Merged"; p.merge="OK";
        toast(`${p.name}: approved and merged`);
      } else if(a==="reject"){
        toast(`${p.name}: review rejected`);
      } else {
        runAction(a, state.selected);
      }
      render();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ---------------------------------------------------------------
   GLOBAL KEYBOARD SHORTCUTS (dashboard only, mirrors keybar)
---------------------------------------------------------------- */
document.addEventListener("keydown", (e)=>{
  if(state.view!=="dashboard") {
    if(e.key==="Escape"){ backToDashboard(); }
    return;
  }
  if(document.activeElement && document.activeElement.tagName==="INPUT") {
    if(e.key==="Escape"){ document.activeElement.blur(); }
    return;
  }
  const list = filteredPackages();
  if(e.key==="/"){ e.preventDefault(); document.getElementById("search").focus(); }
  else if(e.key==="Enter"){
    const target = state.selRow || (list[0] && list[0].name);
    if(target) openDetail(target);
  }
  else if(["f","F"].includes(e.key) && state.selRow) runAction("fetch", state.selRow);
  else if(["r","R"].includes(e.key)) runAction("refresh", state.selRow);
  else if(["a","A"].includes(e.key) && state.selRow) runAction("analyze", state.selRow);
  else if(["b","B"].includes(e.key) && state.selRow) runAction("build", state.selRow);
  else if(["p","P"].includes(e.key) && state.selRow) runAction("publish", state.selRow);
  else if(["i","I"].includes(e.key) && state.selRow) runAction("install", state.selRow);
});

render();
</script>
</body>
</html>
